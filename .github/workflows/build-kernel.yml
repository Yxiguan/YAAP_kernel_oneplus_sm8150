
name: Build neptune droidspaces kernel

on:
  # 在 GitHub Actions 页面手动触发，可指定 AOSP 预编译 clang 版本
  workflow_dispatch:
    inputs:
      clang_ref:
        description: 'AOSP 预编译 clang 分支（platform/prebuilts/clang/host/linux-x86）'
        required: false
        default: 'clang-r547379'
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: arm64 build (neptune_defconfig + droidspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # push/PR 时 inputs 为空，回退到默认 clang 版本
      CLANG_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.clang_ref || 'clang-r547379' }}
      USE_CCACHE: '1'
      CCACHE_BIN: ccache

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            bc bison flex \
            libssl-dev libelf-dev zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            cpio xz-utils

      - name: Fetch AOSP prebuilt clang (${{ env.CLANG_REF }})
        run: |
          set -euo pipefail

          CLONE_DIR="$(pwd)/Toolchain/linux-x86"
          mkdir -p "$(pwd)/Toolchain"

          echo "==> fetching prebuilt clang ${CLANG_REF} (~1.5 GiB), please wait..."
          for i in 1 2 3; do
            if git clone --depth 1 -b "${CLANG_REF}" \
                https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
                "${CLONE_DIR}"; then
              break
            fi
            echo "==> clang download failed (attempt ${i}/3), retrying..."
            rm -rf "${CLONE_DIR}"
            sleep 10
          done
          test -d "${CLONE_DIR}/.git" || { echo "==> clang download failed after 3 attempts"; exit 1; }

          # 兼容不同仓库布局：仓库根目录直接是工具链，或按版本分子目录
          CLANG_BIN="$(find "${CLONE_DIR}" -type f -name clang -path '*/bin/clang' | head -n1)"
          test -x "${CLANG_BIN}" || { echo "prebuilt clang not found in ${CLONE_DIR}"; exit 1; }
          echo "CLANG_DIR=$(dirname "$(dirname "${CLANG_BIN}")")" >> "$GITHUB_ENV"
          "${CLANG_BIN}" --version | head -n1

      - name: Configure ccache
        run: |
          ccache --set-config cache_dir="${HOME}/.cache/ccache"
          ccache --set-config max_size=1G
          ccache --zero-stats

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.CLANG_REF }}-${{ hashFiles('kernel/arch/arm64/configs/neptune_defconfig', 'kernel/arch/arm64/configs/droidspaces/droidspaces.config') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CLANG_REF }}-
            ccache-${{ runner.os }}-

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          # 与 build-neptune-droidspaces.sh 保持一致的参数
          KERNEL_DIR="${GITHUB_WORKSPACE}/kernel"
          CLANG_DIR="${CLANG_DIR}"
          OUT_DIR="${KERNEL_DIR}/out"
          DEFCONFIG="neptune_defconfig"
          FRAGMENT_DIR="${KERNEL_DIR}/arch/arm64/configs/droidspaces"
          FRAGMENTS=(
            "${FRAGMENT_DIR}/droidspaces.config"
            # "${FRAGMENT_DIR}/droidspace-ufw.config"
          )

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-

          # 与脚本一致的工具链存在性检查
          if [ "${USE_CCACHE}" != "0" ]; then
            command -v "${CCACHE_BIN}" >/dev/null 2>&1 || { echo "Missing ccache: ${CCACHE_BIN}"; exit 1; }
            TARGET_CC="${CCACHE_BIN} clang"
          else
            TARGET_CC="clang"
          fi

          command -v "${CROSS_COMPILE}gcc" >/dev/null 2>&1 || { echo "Missing system toolchain: ${CROSS_COMPILE}gcc"; exit 1; }
          command -v "${CROSS_COMPILE_COMPAT}gcc" >/dev/null 2>&1 || { echo "Missing system toolchain: ${CROSS_COMPILE_COMPAT}gcc"; exit 1; }
          command -v "${CROSS_COMPILE_COMPAT}ld.gold" >/dev/null 2>&1 || { echo "Missing system linker: ${CROSS_COMPILE_COMPAT}ld.gold"; exit 1; }

          MAKE_ARGS=(
            -C "${KERNEL_DIR}"
            O="${OUT_DIR}"
            CC="${TARGET_CC}"
            LD=ld.lld
            LD_COMPAT="${CROSS_COMPILE_COMPAT}ld.gold"
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            LLVM_IAS=0
            CROSS_COMPILE="${CROSS_COMPILE}"
            CROSS_COMPILE_COMPAT="${CROSS_COMPILE_COMPAT}"
          )

          echo "==> clang: $("${CLANG_DIR}/bin/clang" --version | head -n1)"
          echo "==> ccache: ${USE_CCACHE}"
          echo "==> defconfig: ${DEFCONFIG}"
          echo "==> fragments: ${FRAGMENTS[*]}"
          echo "==> nproc: $(nproc)"

          make -C "${KERNEL_DIR}" mrproper
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          make "${MAKE_ARGS[@]}" "${DEFCONFIG}"

          "${KERNEL_DIR}/scripts/kconfig/merge_config.sh" \
            -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            "${FRAGMENTS[@]}"

          make "${MAKE_ARGS[@]}" -j"$(nproc)"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaap-neptune-droidspaces-${{ github.sha }}
          path: |
            kernel/out/arch/arm64/boot/
            kernel/out/.config
          if-no-files-found: error
          compression-level: 0
