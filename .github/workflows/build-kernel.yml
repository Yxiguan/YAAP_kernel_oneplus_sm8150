name: Build neptune droidspaces kernel

on:
  workflow_dispatch:
    inputs:
      clang_ref:
        description: 'AOSP 预编译 clang 分支（platform/prebuilts/clang/host/linux-x86）'
        required: false
        default: 'clang-r547379'
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: arm64 build (neptune_defconfig + droidspaces)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLANG_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.clang_ref || 'clang-r547379' }}
      USE_CCACHE: '1'
      CCACHE_BIN: ccache

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache \
            bc bison flex \
            libssl-dev libelf-dev zlib1g-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            cpio xz-utils

      - name: Fetch AOSP prebuilt clang (${{ env.CLANG_REF }})
        run: |
          set -euo pipefail

          GERRIT="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          STAGE="$(pwd)/Toolchain/.stage-${CLANG_REF}"
          mkdir -p "$(pwd)/Toolchain"
          rm -rf "${STAGE}"

          echo "==> downloading ${CLANG_REF} tarball (~1.5 GiB), please wait..."
          ok=0
          for i in 1 2 3; do
            if curl -fsSL --connect-timeout 30 --retry 2 \
                -o "${STAGE}.tar.gz" \
                "${GERRIT}/+archive/refs/heads/main/${CLANG_REF}.tar.gz"; then
              mkdir -p "${STAGE}"
              tar -xzf "${STAGE}.tar.gz" -C "${STAGE}"
              rm -f "${STAGE}.tar.gz"
              ok=1
              break
            fi
            echo "==> tarball download failed (attempt ${i}/3), retrying..."
            rm -f "${STAGE}.tar.gz"
            sleep 5
          done

          if [ "${ok}" != 1 ]; then
            echo "==> tarball download failed, falling back to shallow clone of main"
            rm -rf "${STAGE}"
            for i in 1 2 3; do
              if git clone --depth 1 "${GERRIT}" "${STAGE}"; then
                if [ -d "${STAGE}/${CLANG_REF}" ]; then
                  mv "${STAGE}/${CLANG_REF}" "${STAGE}-tree"
                  rm -rf "${STAGE}"
                  mv "${STAGE}-tree" "${STAGE}"
                fi
                ok=1
                break
              fi
              echo "==> clone failed (attempt ${i}/3), retrying..."
              rm -rf "${STAGE}"
              sleep 5
            done
          fi

          [ "${ok}" = 1 ] || { echo "==> clang download failed after all attempts"; exit 1; }

          CLANG_BIN="$(find "${STAGE}" -type f -name clang -path '*/bin/clang' | head -n1)"
          test -x "${CLANG_BIN}" || { echo "prebuilt clang not found in ${STAGE}"; exit 1; }
          rm -rf "$(pwd)/Toolchain/${CLANG_REF}"
          mv "$(dirname "$(dirname "${CLANG_BIN}")")" "$(pwd)/Toolchain/${CLANG_REF}"
          rm -rf "${STAGE}"

          CLANG_DIR="$(pwd)/Toolchain/${CLANG_REF}"
          echo "CLANG_DIR=${CLANG_DIR}" >> "$GITHUB_ENV"
          "${CLANG_DIR}/bin/clang" --version | head -n1

      - name: Configure ccache
        run: |
          ccache --set-config cache_dir="${HOME}/.cache/ccache"
          ccache --set-config max_size=1G
          ccache --zero-stats

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.CLANG_REF }}-${{ hashFiles('kernel/arch/arm64/configs/neptune_defconfig', 'kernel/arch/arm64/configs/droidspaces/droidspaces.config') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.CLANG_REF }}-
            ccache-${{ runner.os }}-

      - name: Build kernel
        shell: bash
        run: |
          set -euo pipefail

          KERNEL_DIR="${GITHUB_WORKSPACE}/kernel"
          CLANG_DIR="${CLANG_DIR}"
          OUT_DIR="${KERNEL_DIR}/out"
          DEFCONFIG="neptune_defconfig"
          FRAGMENT_DIR="${KERNEL_DIR}/arch/arm64/configs/droidspaces"
          FRAGMENTS=(
            "${FRAGMENT_DIR}/droidspaces.config"
            # "${FRAGMENT_DIR}/droidspace-ufw.config"
          )

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${CLANG_DIR}/bin:${PATH}"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-

          if [ "${USE_CCACHE}" != "0" ]; then
            command -v "${CCACHE_BIN}" >/dev/null 2>&1 || { echo "Missing ccache: ${CCACHE_BIN}"; exit 1; }
            TARGET_CC="${CCACHE_BIN} clang"
          else
            TARGET_CC="clang"
          fi

          command -v "${CROSS_COMPILE}gcc" >/dev/null 2>&1 || { echo "Missing system toolchain: ${CROSS_COMPILE}gcc"; exit 1; }
          command -v "${CROSS_COMPILE_COMPAT}gcc" >/dev/null 2>&1 || { echo "Missing system toolchain: ${CROSS_COMPILE_COMPAT}gcc"; exit 1; }
          command -v "${CROSS_COMPILE_COMPAT}ld.gold" >/dev/null 2>&1 || { echo "Missing system linker: ${CROSS_COMPILE_COMPAT}ld.gold"; exit 1; }

          MAKE_ARGS=(
            -C "${KERNEL_DIR}"
            O="${OUT_DIR}"
            CC="${TARGET_CC}"
            LD=ld.lld
            LD_COMPAT="${CROSS_COMPILE_COMPAT}ld.gold"
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            LLVM_IAS=0
            CROSS_COMPILE="${CROSS_COMPILE}"
            CROSS_COMPILE_COMPAT="${CROSS_COMPILE_COMPAT}"
          )

          echo "==> clang: $("${CLANG_DIR}/bin/clang" --version | head -n1)"
          echo "==> ccache: ${USE_CCACHE}"
          echo "==> defconfig: ${DEFCONFIG}"
          echo "==> fragments: ${FRAGMENTS[*]}"
          echo "==> nproc: $(nproc)"

          make -C "${KERNEL_DIR}" mrproper
          rm -rf "${OUT_DIR}"
          mkdir -p "${OUT_DIR}"

          make "${MAKE_ARGS[@]}" "${DEFCONFIG}"

          "${KERNEL_DIR}/scripts/kconfig/merge_config.sh" \
            -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            "${FRAGMENTS[@]}"

          make "${MAKE_ARGS[@]}" -j"$(nproc)"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yaap-neptune-droidspaces-${{ github.sha }}
          path: |
            kernel/out/arch/arm64/boot/
            kernel/out/.config
          if-no-files-found: error
          compression-level: 0
