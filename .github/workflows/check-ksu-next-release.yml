name: Check KSU-Next legacy & trigger build

on:
  schedule:
    # 每天 UTC 02:00 检查一次
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: check-ksu-next-release
  cancel-in-progress: false

jobs:
  check:
    name: Detect KSU-Next legacy update and trigger build-kernel.yml
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve KSU-Next legacy branch HEAD
        id: ksu
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-remote https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/legacy | awk '{print $1}')"
          test -n "${SHA}" || { echo 'failed to resolve KSU-Next legacy HEAD'; exit 1; }
          echo "KSU-Next legacy HEAD: ${SHA}"
          echo "head=${SHA}" >> "${GITHUB_OUTPUT}"

      - name: Restore last known legacy HEAD
        id: cache
        uses: actions/cache@v4
        with:
          path: .ksu-last-head
          key: ksu-last-head-${{ steps.ksu.outputs.head }}
          restore-keys: |
            ksu-last-head-

      - name: Compare with last build
        id: decide
        shell: bash
        run: |
          LAST="$(cat .ksu-last-head 2>/dev/null || true)"
          CUR="${{ steps.ksu.outputs.head }}"
          if [ -n "${LAST}" ] && [ "${LAST}" = "${CUR}" ]; then
            echo "KSU-Next legacy unchanged at ${CUR}, skipping build."
            echo "build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "KSU-Next legacy: ${LAST:-<none>} -> ${CUR}"
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Persist new legacy HEAD
        if: steps.decide.outputs.build == 'true'
        shell: bash
        run: echo "${{ steps.ksu.outputs.head }}" > .ksu-last-head

      - name: Trigger build-kernel.yml
        if: steps.decide.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-kernel.yml --repo "$GITHUB_REPOSITORY"